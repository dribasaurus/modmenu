name: Build Mod

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.0'

      - name: Find and build Gradle project
        run: |
          PROJECT_DIR=$(find . -mindepth 1 -maxdepth 2 -name build.gradle -printf '%h\n' | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            echo "No build.gradle found"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          cd "$PROJECT_DIR"
          gradle build

      - uses: actions/upload-artifact@v4
        with:
          name: Mod-JAR
          path: |
            **/build/libs/*.jar
          if-no-files-found: error
        
